services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: db-mssql
    restart: always
    ports:
      - 1433:1433
    volumes:
      - sqlvolume:/var/opt/mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DBPASSWORD}
      - MSSQL_PID=Developer

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:local
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlvolume:
