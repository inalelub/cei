services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: db-mssql
    restart: always
    ports:
      - 1433:1433
    volumes:
      - sqlvolume:/var/opt/mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DBPASSWORD}
      - MSSQL_PID=Developer

volumes:
  sqlvolume:
